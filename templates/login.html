<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysCore // Authentifizierung</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo_vertical.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/syscore.css') }}">
</head>
<body class="bg-[#090d16] text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-emerald-500/30 selection:text-emerald-300">

    <div class="w-full max-w-md bg-[#111827] border border-[#1f2937] rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Subtle Glow Background Header -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Brand Identity -->
        <div class="flex items-center gap-3.5 mb-8">
            <img src="{{ url_for('static', filename='img/logo_vertical.png') }}" alt="SysCore Logo" class="w-14 h-14 object-contain drop-shadow-[0_0_16px_rgba(16,185,129,0.4)] shrink-0">
            <div>
                <h1 class="text-xl font-extrabold tracking-wider text-white">SYS<span class="text-emerald-400">CORE</span></h1>
                <p class="text-xs text-gray-400 font-mono">Server- & Webspace Control</p>
            </div>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-5 p-3 rounded-xl border text-xs font-medium {{ 'bg-emerald-950/40 border-emerald-700/60 text-emerald-300' if category == 'success' else 'bg-rose-950/40 border-rose-700/60 text-rose-300' }}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-mono uppercase text-gray-400 mb-1.5 font-medium">Benutzername</label>
                <div class="relative">
                    <input type="text" name="username" required autocomplete="username" autofocus
                           placeholder="z.B. admin"
                           class="w-full px-3.5 py-2.5 bg-[#090d16] border border-[#1f2937] focus:border-emerald-500 rounded-xl text-white text-sm outline-none transition font-sans">
                </div>
            </div>

            <div>
                <label class="block text-xs font-mono uppercase text-gray-400 mb-1.5 font-medium">Passwort</label>
                <div class="relative">
                    <input type="password" name="password" required autocomplete="current-password"
                           placeholder="••••••••••••"
                           class="w-full px-3.5 py-2.5 bg-[#090d16] border border-[#1f2937] focus:border-emerald-500 rounded-xl text-white text-sm outline-none transition font-sans">
                </div>
            </div>

            <button type="submit" class="w-full mt-2 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-emerald-900/30">
                Im Cockpit anmelden
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-[#1f2937] flex items-center justify-between text-[11px] text-gray-500 font-mono">
            <span>Auth: SQLite & RBAC</span>
            <span class="text-emerald-400/80">TLS / Strict Isolation</span>
        </div>
    </div>

</body>
</html>
