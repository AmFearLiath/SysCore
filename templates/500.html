{% extends "base.html" %}
{% block title %}500 Serverfehler // SysCore{% endblock %}

{% block content %}
<div class="sys-card p-12 text-center max-w-lg mx-auto my-12 space-y-4">
    <div class="text-4xl font-extrabold text-rose-500 font-mono">500</div>
    <h1 class="text-xl font-bold text-white tracking-tight">Interner Systemfehler</h1>
    <p class="text-xs font-mono text-gray-400">Ein unerwarteter Fehler ist aufgetreten.</p>
    {% if error %}
    <div class="p-3 bg-dark-950 border border-dark-700 rounded-lg text-xs font-mono text-rose-400 select-text text-left overflow-x-auto">
        {{ error }}
    </div>
    {% endif %}
    <div class="pt-4">
        <a href="{{ url_for('system.index') }}" class="px-4 py-2 bg-dark-800 hover:bg-dark-700 text-gray-200 rounded-xl text-xs font-mono transition">
            Zurück zum Dashboard
        </a>
    </div>
</div>
{% endblock %}
